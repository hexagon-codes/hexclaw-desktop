[package]
name = "hexclaw-desktop"
version = "0.5.0-beta"
description = "HexClaw Desktop — 企业级安全个人 AI Agent 桌面客户端"
authors = ["hexagon-codes <ai@hexclaw.net>"]
license = "Apache-2.0"
repository = "https://github.com/hexagon-codes/hexclaw-desktop"
edition = "2021"

[lib]
name = "hexclaw_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-process = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["time"] }
log = "0.4"
env_logger = "0.11"
url = "2"
libc = "0.2"
base64 = "0.22"
sys-locale = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", default-features = false }
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSPrintInfo", "NSPrintOperation", "NSPrintPanel", "NSPrinter"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSData"] }
objc2-pdf-kit = { version = "0.3", default-features = false, features = ["std", "PDFDocument", "PDFPage", "objc2-app-kit"] }


[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
