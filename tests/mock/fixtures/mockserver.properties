# Fixed local fixtures only. No forwarding, recording, live LLM, MCP, or WASM.
mockserver.logLevel=INFO
mockserver.metricsEnabled=false
mockserver.devMode=true
mockserver.maxExpectations=256
mockserver.maxLogEntries=2048
mockserver.maxLoggedBodyBytes=1048576
mockserver.enableCORSForAPI=false
mockserver.enableCORSForAllResponses=false
mockserver.mcpEnabled=false
mockserver.llmSemanticMatchingEnabled=false
mockserver.llmInferUsageEnabled=false
mockserver.llmMetricsEnabled=false
mockserver.attemptToProxyIfNoMatchingExpectation=false
mockserver.forwardProxyBlockPrivateNetworks=true
mockserver.wasmEnabled=false
mockserver.grpcEnabled=false

# MockServer 7.4 has no single templateEnabled switch. Block the JavaScript
# return token and the object/dynamic-expression delimiters used by the three
# engines. Fixtures are also contract-checked to permit only passive
# httpResponse actions.
mockserver.javascriptDisallowedText=return,{
mockserver.javascriptTemplateExecutionTimeout=250
mockserver.velocityDisallowClassLoading=true
mockserver.velocityDisallowedText={,$
mockserver.mustacheDisallowedText={

mockserver.initializationJsonPath=/config/mockserverInitialization.json
mockserver.watchInitializationJson=false
mockserver.failOnInitializationError=true
mockserver.persistExpectations=false
mockserver.persistRecordedExpectations=false
mockserver.persistRecordedRequestsToDisk=false
