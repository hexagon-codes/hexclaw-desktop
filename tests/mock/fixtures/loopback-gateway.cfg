global
  maxconn 128
  log stdout format raw local0

defaults
  mode tcp
  log global
  option dontlognull
  timeout connect 2s
  timeout client 30s
  timeout server 30s

resolvers docker
  nameserver dns 127.0.0.11:53
  timeout resolve 1s
  timeout retry 1s
  hold nx 1s
  hold other 1s
  hold valid 10s

frontend mockserver_loopback
  bind :18080
  default_backend mockserver_fixed

backend mockserver_fixed
  server mockserver mockserver:1080 check resolvers docker init-addr libc,none

frontend toxiproxy_control_loopback
  bind :18474
  default_backend toxiproxy_control_fixed

backend toxiproxy_control_fixed
  server toxiproxy_control toxiproxy:8474 check resolvers docker init-addr libc,none

frontend toxiproxy_data_loopback
  bind :18666
  default_backend toxiproxy_data_fixed

backend toxiproxy_data_fixed
  server toxiproxy_data toxiproxy:8666 check resolvers docker init-addr libc,none
