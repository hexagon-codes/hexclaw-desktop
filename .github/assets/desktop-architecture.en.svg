<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc" data-generator="fireworks-tech-graph" data-quality-profile="showcase">
<title id="title">HexClaw Desktop · Runtime architecture</title><desc id="desc">The Vue workspace accesses the selected HexClaw service through transport and file bridges in the Tauri Rust native host. Local mode starts a Sidecar on the device. Cloud mode connects to a remote service without starting a local Sidecar. Task execution and data belong to the selected service.</desc>
