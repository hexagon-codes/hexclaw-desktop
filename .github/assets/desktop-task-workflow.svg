<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc" data-generator="fireworks-tech-graph" data-quality-profile="showcase">
<title id="title">HexClaw Desktop · 从任务到交付</title><desc id="desc">桌面对话、已绑定 IM、定时任务和 Webhook 进入所选 HexClaw 服务。服务完成会话路由、检索知识和记忆、Agent 执行，按需调用配置模型、Skill、MCP 和场景包。结果持久化后通过桌面展示、IM 回传以及导出或打印交付。</desc>
