<title id="title">HexClaw Desktop · 运行架构</title><desc id="desc">Vue 工作台通过 Tauri Rust 原生宿主的传输和文件桥接访问当前选择的 HexClaw 服务。本地模式启动本机 Sidecar；云端模式连接远端服务，不启动本地 Sidecar。任务执行和数据归属于选中的服务。</desc>
