<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc" data-generator="fireworks-tech-graph" data-quality-profile="showcase">
<title id="title">HexClaw Desktop · From task to delivery</title><desc id="desc">Desktop chat, connected IM, scheduled tasks, and Webhooks enter the selected HexClaw service. The service routes sessions, retrieves knowledge and memory, and runs Agents using configured models, Skills, MCP tools, and scenario packs as needed. Results are persisted, then delivered through the desktop app, IM replies, exports, or printing.</desc>
