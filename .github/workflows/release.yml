name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or commit to package without publishing'
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Release Metadata
    runs-on: ubuntu-24.04
    outputs:
      prerelease: ${{ steps.meta.outputs.prerelease }}
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Validate metadata and resolve package source
        id: meta
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="v$(node -p "require('./package.json').version")"
          fi
          node ./scripts/ci/verify-release.mjs "$TAG"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  checks:
    name: CI Checks
    needs: [validate]
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.validate.outputs.sha }}
    secrets:
      HEXCLAW_DOCS_READ_KEY: ${{ secrets.HEXCLAW_DOCS_READ_KEY }}

  prepare-release:
    name: Prepare Draft Release
    needs: [validate, checks]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    outputs:
      id: ${{ steps.release.outputs.id }}
    steps:
      - name: Resolve draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          SOURCE_SHA: ${{ needs.validate.outputs.sha }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" != "push" ]]; then
            exit 0
          fi
          # Draft 不能按 tag 查询，使用列表复用失败运行已创建的 Release。
          RELEASE_ID="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"${RELEASE_TAG}\") | .id")"
          if [[ -z "$RELEASE_ID" ]]; then
            RELEASE_ID="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="$RELEASE_TAG" \
              -f target_commitish="$SOURCE_SHA" \
              -f name="HexClaw Desktop ${RELEASE_TAG}" \
              -f body='See the generated release notes below for changes in this version.' \
              -F draft=true \
              -F prerelease="$PRERELEASE" \
              -F generate_release_notes=true \
              --jq '.id')"
          fi
          echo "id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.target }})
    needs: [validate, checks, prepare-release]
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-26
            target: aarch64-apple-darwin
            go_os: darwin
            go_arch: arm64
            sidecar_name: hexclaw-aarch64-apple-darwin
            render_target: darwin-arm64
            tauri_args: --target aarch64-apple-darwin
          - platform: macos-26
            target: x86_64-apple-darwin
            go_os: darwin
            go_arch: amd64
            sidecar_name: hexclaw-x86_64-apple-darwin
            render_target: darwin-x86_64
            tauri_args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            go_os: linux
            go_arch: amd64
            sidecar_name: hexclaw-x86_64-unknown-linux-gnu
            render_target: linux-x86_64
            tauri_args: ''
          - platform: windows-2025
            target: x86_64-pc-windows-msvc
            go_os: windows
            go_arch: amd64
            sidecar_name: hexclaw-x86_64-pc-windows-msvc.exe
            render_target: windows-x86_64
            tauri_args: --target x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.sha }}

      # --- Go sidecar build ---
      - name: Resolve hexclaw backend ref
        id: sidecar_ref
        run: |
          REF=$(grep '^HEXCLAW_REF' Makefile | head -1 | sed 's/.*?= *//')
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "Resolved HEXCLAW_REF=${REF}"

      - name: Checkout hexclaw backend
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: hexagon-codes/hexclaw
          ref: ${{ steps.sidecar_ref.outputs.ref }}
          path: hexclaw

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache-dependency-path: hexclaw/go.sum

      - name: Build hexclaw sidecar
        env:
          GOOS: ${{ matrix.go_os }}
          GOARCH: ${{ matrix.go_arch }}
          CGO_ENABLED: '0'
          GOPRIVATE: github.com/hexagon-codes/*
        run: |
          mkdir -p src-tauri/binaries
          DESKTOP_VERSION="$(node -p "require('./package.json').version.replace(/^v/, '')")"
          cd hexclaw
          VERSION="${DESKTOP_VERSION}"
          COMMIT="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go build -trimpath -ldflags="-s -w -X main.version=${VERSION} -X main.sidecarVersionIdentity=hexclaw-sidecar-version=${VERSION}; -X main.commit=${COMMIT} -X main.date=${DATE}" \
            -o ../src-tauri/binaries/${{ matrix.sidecar_name }} ./cmd/hexclaw
          cd ..
          node ./scripts/ci/verify-sidecar-version.mjs --ci-build "src-tauri/binaries/${{ matrix.sidecar_name }}"

      - name: Download Ollama binary
        shell: bash
        run: |
          OLLAMA_VERSION=$(grep '^OLLAMA_VERSION' Makefile | head -1 | sed 's/.*?= *//')
          OLLAMA_BASE="https://github.com/ollama/ollama/releases/download/v${OLLAMA_VERSION}"
          mkdir -p src-tauri/binaries/ollama-bundle
          case "${{ matrix.target }}" in
            aarch64-apple-darwin|x86_64-apple-darwin)
              echo "Downloading Ollama v${OLLAMA_VERSION} for macOS..."
              curl -fSL "${OLLAMA_BASE}/ollama-darwin.tgz" -o /tmp/ollama-darwin.tgz
              tar xzf /tmp/ollama-darwin.tgz -C src-tauri/binaries/ollama-bundle
              rm -f /tmp/ollama-darwin.tgz
              ;;
            x86_64-unknown-linux-gnu)
              echo "Linux: Ollama too large (~1.9GB with GPU libs) to embed, creating stub"
              echo "Users should install Ollama separately: curl -fsSL https://ollama.com/install.sh | sh"
              touch src-tauri/binaries/ollama-bundle/ollama
              ;;
            x86_64-pc-windows-msvc)
              echo "Windows: Ollama too large (~1.9GB with GPU libs) to embed in installer, creating stub"
              echo "Users should install Ollama separately: https://ollama.com/download/windows"
              touch src-tauri/binaries/ollama-bundle/ollama.exe
              ;;
            *)
              echo "Unknown target, creating stub"
              touch src-tauri/binaries/ollama-bundle/ollama
              ;;
          esac
          ls -lh src-tauri/binaries/ollama-bundle/

      # pandoc/typst as Tauri externalBin sidecars: download + SHA256-verify,
      # named binaries/{pandoc,typst}-<triple> so tauri-action bundles & signs them.
      # reference.docx is a tracked resource (src-tauri/render-assets), no staging needed.
      - name: Install Rust 1.94.0
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 固定 Rust 1.94.0
        with:
          toolchain: '1.94.0'
          targets: ${{ matrix.target }}

      - name: Stage prebuilt render engines (pandoc + typst)
        env:
          RENDER_BUNDLE_MODE: prebuilt
          RENDER_BUNDLE_TARGET: ${{ matrix.render_target }}
        run: |
          ./release/scripts/render-bundle.sh src-tauri/binaries
          ls -lh src-tauri/binaries/pandoc-* src-tauri/binaries/typst-*

      # --- Frontend & Tauri build ---
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: pnpm install --frozen-lockfile

      - name: Disable updater artifacts when signing key is unavailable
        run: |
          node -e "const fs=require('fs'); const path='src-tauri/tauri.conf.json'; const cfg=JSON.parse(fs.readFileSync(path,'utf8')); if (!process.env.TAURI_SIGNING_PRIVATE_KEY) { cfg.bundle = { ...(cfg.bundle || {}), createUpdaterArtifacts: false }; fs.writeFileSync(path, JSON.stringify(cfg, null, 2) + '\n'); console.log('Disabled updater artifacts for unsigned release build.'); } else { console.log('Keeping updater artifacts enabled.'); }"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Resolve Tauri bundle args
        id: tauri_args
        shell: bash
        run: |
          args="${{ matrix.tauri_args }}"
          # Windows 仅打 NSIS 安装器（.exe），跳过 WiX/MSI：light.exe 打包大体积 ollama 资源失败
          if [[ "${{ matrix.target }}" == "x86_64-pc-windows-msvc" ]]; then
            args="$args --bundles nsis"
          fi
          args="$args -- --locked"
          echo "args=$args" >> "$GITHUB_OUTPUT"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@19b93bb55601e3e373a93cfb6eb4242e45f5af20 # action-v0.6.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare-release.outputs.id }}
          tagName: ${{ github.event_name == 'push' && needs.validate.outputs.tag || '' }}
          args: ${{ steps.tauri_args.outputs.args }}
          retryAttempts: 2

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hexclaw-${{ needs.validate.outputs.tag }}-${{ matrix.target }}
          if-no-files-found: error
          path: |
            ${{ startsWith(matrix.target, 'aarch64-apple-darwin') && 'src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg' || '' }}
            ${{ startsWith(matrix.target, 'x86_64-apple-darwin') && 'src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg' || '' }}
            ${{ matrix.target == 'x86_64-unknown-linux-gnu' && 'src-tauri/target/release/bundle/appimage/*.AppImage' || '' }}
            ${{ matrix.target == 'x86_64-unknown-linux-gnu' && 'src-tauri/target/release/bundle/deb/*.deb' || '' }}
            ${{ matrix.target == 'x86_64-pc-windows-msvc' && 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe' || '' }}

      - name: Upload updater artifacts and signatures
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hexclaw-updater-${{ needs.validate.outputs.tag }}-${{ matrix.target }}
          if-no-files-found: warn
          path: |
            ${{ startsWith(matrix.target, 'aarch64-apple-darwin') && 'src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz*' || '' }}
            ${{ startsWith(matrix.target, 'x86_64-apple-darwin') && 'src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz*' || '' }}
            ${{ matrix.target == 'x86_64-unknown-linux-gnu' && 'src-tauri/target/release/bundle/appimage/*.AppImage.sig' || '' }}
            ${{ matrix.target == 'x86_64-unknown-linux-gnu' && 'src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz*' || '' }}
            ${{ matrix.target == 'x86_64-pc-windows-msvc' && 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe.sig' || '' }}

  publish:
    name: Publish Release
    needs: [validate, prepare-release, build]
    if: github.event_name == 'push'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Publish completed draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.id }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false -F prerelease="$PRERELEASE" --silent

  update-tap:
    name: Update Homebrew Tap
    needs: [validate, publish]
    if: github.event_name == 'push' && needs.validate.outputs.prerelease != 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Download macOS DMGs and compute SHA256
        id: sha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          VERSION="${TAG#v}"
          REPO="hexagon-codes/hexclaw-desktop"

          # 输出键与 Cask 对应，Intel 安装包文件名使用 x64 后缀。
          for ARCH in aarch64 x86_64; do
            case "$ARCH" in
              x86_64) DMG_ARCH="x64" ;;
              *)      DMG_ARCH="$ARCH" ;;
            esac
            DMG="HexClaw_${VERSION}_${DMG_ARCH}.dmg"
            URL="https://github.com/${REPO}/releases/download/${TAG}/${DMG}"
            echo "Downloading ${DMG}..."
            curl -fSL -o "/tmp/${DMG}" "$URL"
            SHA=$(sha256sum "/tmp/${DMG}" | awk '{print $1}')
            [[ "$SHA" =~ ^[0-9a-f]{64}$ ]]
            echo "SHA256 (${ARCH}): ${SHA}"
            echo "sha_${ARCH}=${SHA}" >> "$GITHUB_OUTPUT"
          done
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew-tap
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: hexagon-codes/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: homebrew-tap

      - name: Update Cask
        run: |
          set -euo pipefail
          VERSION="${{ steps.sha.outputs.version }}"
          SHA_ARM="${{ steps.sha.outputs.sha_aarch64 }}"
          SHA_INTEL="${{ steps.sha.outputs.sha_x86_64 }}"
          CASK="homebrew-tap/Casks/hexclaw.rb"
          [[ "$SHA_ARM" =~ ^[0-9a-f]{64}$ && "$SHA_INTEL" =~ ^[0-9a-f]{64}$ ]]

          sed -i "s/^  version \".*\"/  version \"${VERSION}\"/" "$CASK"

          sed -i "/on_arm/,/end/{s/sha256 .*/sha256 \"${SHA_ARM}\"/;}" "$CASK"
          sed -i "/on_intel/,/end/{s/sha256 .*/sha256 \"${SHA_INTEL}\"/;}" "$CASK"

          echo "Updated Cask to ${VERSION}"
          cat "$CASK"

      - name: Push to homebrew-tap
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: bump hexclaw to ${{ steps.sha.outputs.version }}"
          git push
