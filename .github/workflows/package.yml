name: Package

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to package (branch, tag, or commit SHA)
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: package-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Lint, Type Check & Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type Check
        run: pnpm type-check

      - name: Test
        run: pnpm test:unit

  build:
    name: Package (${{ matrix.target }})
    needs: checks
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-26
            target: aarch64-apple-darwin
            go_os: darwin
            go_arch: arm64
            sidecar_name: hexclaw-aarch64-apple-darwin
            render_target: darwin-arm64
            tauri_args: --target aarch64-apple-darwin
          - platform: macos-26
            target: x86_64-apple-darwin
            go_os: darwin
            go_arch: amd64
            sidecar_name: hexclaw-x86_64-apple-darwin
            render_target: darwin-x86_64
            tauri_args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            go_os: linux
            go_arch: amd64
            sidecar_name: hexclaw-x86_64-unknown-linux-gnu
            render_target: linux-x86_64
            tauri_args: ''
          - platform: windows-2025
            target: x86_64-pc-windows-msvc
            go_os: windows
            go_arch: amd64
            sidecar_name: hexclaw-x86_64-pc-windows-msvc.exe
            render_target: windows-x86_64
            tauri_args: --target x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve hexclaw backend ref
        id: sidecar_ref
        run: |
          REF=$(grep '^HEXCLAW_REF' Makefile | head -1 | sed 's/.*?= *//')
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "Resolved HEXCLAW_REF=${REF}"

      - name: Checkout hexclaw backend
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: hexagon-codes/hexclaw
          ref: ${{ steps.sidecar_ref.outputs.ref }}
          path: hexclaw
          token: ${{ secrets.PRIVATE_REPO_TOKEN || github.token }}

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache-dependency-path: hexclaw/go.sum

      - name: Configure private modules
        run: |
          if [ -n "${{ secrets.PRIVATE_REPO_TOKEN }}" ]; then
            git config --global url."https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"
          fi

      - name: Build hexclaw sidecar
        env:
          GOOS: ${{ matrix.go_os }}
          GOARCH: ${{ matrix.go_arch }}
          CGO_ENABLED: '0'
          GOPRIVATE: github.com/hexagon-codes/*
        run: |
          mkdir -p src-tauri/binaries
          DESKTOP_VERSION="$(node -p "require('./package.json').version.replace(/^v/, '')")"
          cd hexclaw
          VERSION="${DESKTOP_VERSION}"
          COMMIT="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go build -ldflags="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}" \
            -o ../src-tauri/binaries/${{ matrix.sidecar_name }} ./cmd/hexclaw
          cd ..
          node ./scripts/ci/verify-sidecar-version.mjs "src-tauri/binaries/${{ matrix.sidecar_name }}"

      - name: Download Ollama binary
        shell: bash
        run: |
          OLLAMA_VERSION=$(grep '^OLLAMA_VERSION' Makefile | head -1 | sed 's/.*?= *//')
          OLLAMA_BASE="https://github.com/ollama/ollama/releases/download/v${OLLAMA_VERSION}"
          mkdir -p src-tauri/binaries/ollama-bundle
          case "${{ matrix.target }}" in
            aarch64-apple-darwin|x86_64-apple-darwin)
              curl -fSL "${OLLAMA_BASE}/ollama-darwin.tgz" -o /tmp/ollama-darwin.tgz
              tar xzf /tmp/ollama-darwin.tgz -C src-tauri/binaries/ollama-bundle
              rm -f /tmp/ollama-darwin.tgz
              ;;
            x86_64-unknown-linux-gnu)
              touch src-tauri/binaries/ollama-bundle/ollama
              ;;
            x86_64-pc-windows-msvc)
              touch src-tauri/binaries/ollama-bundle/ollama.exe
              ;;
          esac

      - name: Install Rust 1.94.0
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 固定 Rust 1.94.0
        with:
          toolchain: '1.94.0'
          targets: ${{ matrix.target }}

      - name: Stage prebuilt render engines (pandoc + typst)
        env:
          RENDER_BUNDLE_MODE: prebuilt
          RENDER_BUNDLE_TARGET: ${{ matrix.render_target }}
        run: |
          ./release/scripts/render-bundle.sh src-tauri/binaries
          ls -lh src-tauri/binaries/pandoc-* src-tauri/binaries/typst-*

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: pnpm install --frozen-lockfile

      - name: Disable updater artifacts when signing key is unavailable
        run: |
          node -e "const fs=require('fs'); const path='src-tauri/tauri.conf.json'; const cfg=JSON.parse(fs.readFileSync(path,'utf8')); if (!process.env.TAURI_SIGNING_PRIVATE_KEY) { cfg.bundle = { ...(cfg.bundle || {}), createUpdaterArtifacts: false }; fs.writeFileSync(path, JSON.stringify(cfg, null, 2) + '\n'); console.log('Disabled updater artifacts for unsigned package build.'); } else { console.log('Keeping updater artifacts enabled.'); }"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Resolve Tauri bundle args
        id: tauri_args
        shell: bash
        run: |
          args="${{ matrix.tauri_args }}"
          version="$(node -p "require('./package.json').version")"
          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi
          if [[ "${{ matrix.target }}" == "x86_64-pc-windows-msvc" && "$prerelease" == "true" ]]; then
            args="$args --bundles nsis"
          fi
          echo "args=$args" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Build Tauri packages
        uses: tauri-apps/tauri-action@19b93bb55601e3e373a93cfb6eb4242e45f5af20 # action-v0.6.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ steps.tauri_args.outputs.args }}
          retryAttempts: 2

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hexclaw-${{ matrix.target }}
          if-no-files-found: error
          path: |
            ${{ startsWith(matrix.target, 'aarch64-apple-darwin') && 'src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg' || '' }}
            ${{ startsWith(matrix.target, 'x86_64-apple-darwin') && 'src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg' || '' }}
            ${{ matrix.target == 'x86_64-unknown-linux-gnu' && 'src-tauri/target/release/bundle/appimage/*.AppImage' || '' }}
            ${{ matrix.target == 'x86_64-unknown-linux-gnu' && 'src-tauri/target/release/bundle/deb/*.deb' || '' }}
            ${{ matrix.target == 'x86_64-pc-windows-msvc' && 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe' || '' }}
            ${{ matrix.target == 'x86_64-pc-windows-msvc' && steps.tauri_args.outputs.prerelease != 'true' && 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi' || '' }}
