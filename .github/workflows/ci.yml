name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enforce workflow supply-chain policy
        run: node --test tests/gates/workflow-supply-chain-policy.test.mjs

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type Check
        run: pnpm type-check

      - name: Build
        run: pnpm build-only

  test:
    name: Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run Tests
        run: pnpm test:unit

      - name: Package Security Gates
        run: pnpm test:package-gates

  rust-check:
    name: Rust Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri -> target

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Create build stubs
        run: |
          mkdir -p src-tauri/binaries
          # externalBin sidecars (hexclaw + render engines) — empty stubs satisfy the
          # tauri build-script existence check; cargo check never executes them.
          touch src-tauri/binaries/hexclaw-x86_64-unknown-linux-gnu
          touch src-tauri/binaries/pandoc-x86_64-unknown-linux-gnu
          touch src-tauri/binaries/typst-x86_64-unknown-linux-gnu
          mkdir -p src-tauri/binaries/ollama-bundle
          touch src-tauri/binaries/ollama-bundle/ollama
          # reference.docx is a tracked resource (src-tauri/render-assets), no stub needed.
          mkdir -p dist
          echo '<html></html>' > dist/index.html

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check
