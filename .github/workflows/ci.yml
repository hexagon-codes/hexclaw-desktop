name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type Check
        run: pnpm type-check

      - name: Build
        run: pnpm build-only

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run Tests
        run: pnpm test:unit

  rust-check:
    name: Rust Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Create build stubs
        run: |
          mkdir -p src-tauri/binaries
          # externalBin sidecars (hexclaw + render engines) — empty stubs satisfy the
          # tauri build-script existence check; cargo check never executes them.
          touch src-tauri/binaries/hexclaw-x86_64-unknown-linux-gnu
          touch src-tauri/binaries/pandoc-x86_64-unknown-linux-gnu
          touch src-tauri/binaries/typst-x86_64-unknown-linux-gnu
          mkdir -p src-tauri/binaries/ollama-bundle
          touch src-tauri/binaries/ollama-bundle/ollama
          # reference.docx is a tracked resource (src-tauri/render-assets), no stub needed.
          mkdir -p dist
          echo '<html></html>' > dist/index.html

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check
